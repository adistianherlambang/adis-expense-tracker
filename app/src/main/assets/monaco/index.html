<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monaco Code Editor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: Consolas, Menlo, Monaco, "Courier New", monospace;
        }
        #container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        /* Offline Monaco Fallback Surface */
        .fallback-editor {
            display: flex;
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            font-family: Consolas, Menlo, Monaco, monospace;
            font-size: 14px;
            line-height: 22px;
            overflow: hidden;
            position: relative;
        }
        .gutter {
            width: 48px;
            background-color: #1e1e1e;
            color: #858585;
            text-align: right;
            padding: 10px 8px 10px 0;
            border-right: 1px solid #2d2d2d;
            overflow: hidden;
            user-select: none;
            flex-shrink: 0;
        }
        .code-surface-wrapper {
            flex-grow: 1;
            height: 100%;
            position: relative;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }
        .code-textarea {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            color: #d4d4d4;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            padding: 10px 12px;
            border: none;
            outline: none;
            resize: none;
            white-space: pre;
            overflow-wrap: normal;
            tab-size: 2;
            -webkit-user-select: text;
            user-select: text;
            caret-color: #569cd6;
        }
        .minimap-bar {
            width: 60px;
            background-color: #1a1a1a;
            border-left: 1px solid #2d2d2d;
            height: 100%;
            flex-shrink: 0;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <script>
        (function() {
            let activeFileId = null;
            let activeFilePath = null;
            let currentLanguage = "javascript";
            let originalContent = "";
            let currentContent = "";
            let isDirty = false;
            let debounceTimer = null;

            // Element references
            const container = document.getElementById('container');
            let gutterEl = null;
            let textareaEl = null;

            function initFallbackEditor() {
                container.innerHTML = `
                    <div class="fallback-editor">
                        <div class="gutter" id="line-gutter">1</div>
                        <div class="code-surface-wrapper">
                            <textarea class="code-textarea" id="editor-textarea" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
                        </div>
                        <div class="minimap-bar" id="minimap"></div>
                    </div>
                `;

                gutterEl = document.getElementById('line-gutter');
                textareaEl = document.getElementById('editor-textarea');

                textareaEl.addEventListener('input', function() {
                    currentContent = textareaEl.value;
                    isDirty = (currentContent !== originalContent);
                    updateLineNumbers();
                    updateCursor();

                    if (debounceTimer) clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(function() {
                        if (window.AndroidEditorBridge) {
                            window.AndroidEditorBridge.onContentChanged(activeFileId, currentContent, isDirty);
                        }
                    }, 150);
                });

                textareaEl.addEventListener('keyup', updateCursor);
                textareaEl.addEventListener('click', updateCursor);
                textareaEl.addEventListener('scroll', function() {
                    gutterEl.scrollTop = textareaEl.scrollTop;
                });

                // Tab key handler (insert 2 spaces)
                textareaEl.addEventListener('keydown', function(e) {
                    if (e.key === 'Tab') {
                        e.preventDefault();
                        const start = this.selectionStart;
                        const end = this.selectionEnd;
                        this.value = this.value.substring(0, start) + "  " + this.value.substring(end);
                        this.selectionStart = this.selectionEnd = start + 2;
                        textareaEl.dispatchEvent(new Event('input'));
                    }
                });
            }

            function updateLineNumbers() {
                if (!gutterEl || !textareaEl) return;
                const lines = (textareaEl.value.match(/\n/g) || []).length + 1;
                let numbersHtml = "";
                for (let i = 1; i <= lines; i++) {
                    numbersHtml += i + "<br>";
                }
                gutterEl.innerHTML = numbersHtml;
            }

            function updateCursor() {
                if (!textareaEl) return;
                const text = textareaEl.value.substr(0, textareaEl.selectionStart);
                const lines = text.split("\n");
                const line = lines.length;
                const col = lines[lines.length - 1].length + 1;

                if (window.AndroidEditorBridge) {
                    window.AndroidEditorBridge.onCursorPosition(line, col);
                }
            }

            // Public bridge methods invoked by Kotlin
            window.monacoBridge = {
                openFile: function(fileId, path, content, language, readOnly) {
                    activeFileId = fileId;
                    activeFilePath = path;
                    currentLanguage = language || "plaintext";
                    originalContent = content || "";
                    currentContent = originalContent;
                    isDirty = false;

                    if (!textareaEl) initFallbackEditor();

                    textareaEl.value = currentContent;
                    textareaEl.readOnly = !!readOnly;
                    updateLineNumbers();
                    updateCursor();

                    if (window.AndroidEditorBridge) {
                        window.AndroidEditorBridge.onContentChanged(activeFileId, currentContent, false);
                    }
                },

                getContent: function() {
                    return currentContent;
                },

                saveFile: function() {
                    originalContent = currentContent;
                    isDirty = false;
                    if (window.AndroidEditorBridge) {
                        window.AndroidEditorBridge.onContentChanged(activeFileId, currentContent, false);
                    }
                    return currentContent;
                },

                insertText: function(text) {
                    if (!textareaEl) return;
                    const start = textareaEl.selectionStart;
                    const end = textareaEl.selectionEnd;
                    textareaEl.value = textareaEl.value.substring(0, start) + text + textareaEl.value.substring(end);
                    textareaEl.selectionStart = textareaEl.selectionEnd = start + text.length;
                    textareaEl.dispatchEvent(new Event('input'));
                },

                setFont: function(family, size, lineHeight) {
                    if (!textareaEl) return;
                    if (family) textareaEl.style.fontFamily = family + ', monospace';
                    if (size) textareaEl.style.fontSize = size + 'px';
                    if (lineHeight) textareaEl.style.lineHeight = lineHeight + 'px';
                },

                toggleMinimap: function(enabled) {
                    const minimap = document.getElementById('minimap');
                    if (minimap) minimap.style.display = enabled ? 'block' : 'none';
                },

                goToLine: function(lineNumber) {
                    if (!textareaEl) return;
                    const lines = textareaEl.value.split('\n');
                    let charIndex = 0;
                    for (let i = 0; i < Math.min(lineNumber - 1, lines.length); i++) {
                        charIndex += lines[i].length + 1;
                    }
                    textareaEl.focus();
                    textareaEl.setSelectionRange(charIndex, charIndex);
                    updateCursor();
                },

                undo: function() {
                    document.execCommand('undo');
                },

                redo: function() {
                    document.execCommand('redo');
                }
            };

            // Initialize editor on DOM ready
            document.addEventListener('DOMContentLoaded', function() {
                initFallbackEditor();
                if (window.AndroidEditorBridge) {
                    window.AndroidEditorBridge.onEditorReady();
                }
            });
        })();
    </script>
</body>
</html>
