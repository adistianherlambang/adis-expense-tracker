<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monaco Code Editor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: Consolas, Menlo, Monaco, "Courier New", monospace;
        }
        .editor-container {
            display: flex;
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            font-family: Consolas, Menlo, Monaco, monospace;
            font-size: 14px;
            line-height: 22px;
            overflow: hidden;
            position: relative;
        }
        .gutter {
            width: 52px;
            background-color: #1e1e1e;
            color: #858585;
            text-align: right;
            padding: 10px 8px 10px 0;
            border-right: 1px solid #2d2d2d;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            flex-shrink: 0;
            font-size: 13px;
            line-height: 22px;
        }
        .code-surface-wrapper {
            flex-grow: 1;
            height: 100%;
            position: relative;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            background-color: #1e1e1e;
        }
        .code-textarea {
            width: 100%;
            min-height: 100%;
            height: auto;
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: Consolas, Menlo, Monaco, monospace;
            font-size: 14px;
            line-height: 22px;
            padding: 10px 14px;
            border: none;
            outline: none;
            resize: none;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
            tab-size: 2;
            -moz-tab-size: 2;
            user-select: text !important;
            -webkit-user-select: text !important;
            caret-color: #569cd6;
            display: block;
        }
        .minimap-bar {
            width: 50px;
            background-color: #1a1a1a;
            border-left: 1px solid #2d2d2d;
            height: 100%;
            flex-shrink: 0;
            opacity: 0.6;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <div class="editor-container" id="editor-container" onclick="focusEditor()">
        <div class="gutter" id="line-gutter">1</div>
        <div class="code-surface-wrapper" id="code-wrapper" onclick="focusEditor()">
            <textarea class="code-textarea" id="editor-textarea" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder=""></textarea>
        </div>
        <div class="minimap-bar" id="minimap"></div>
    </div>

    <script>
        (function() {
            let activeFileId = null;
            let activeFilePath = null;
            let currentLanguage = "plaintext";
            let originalContent = "";
            let currentContent = "";
            let isDirty = false;
            let debounceTimer = null;

            const gutterEl = document.getElementById('line-gutter');
            const textareaEl = document.getElementById('editor-textarea');
            const codeWrapper = document.getElementById('code-wrapper');

            window.focusEditor = function() {
                if (textareaEl) {
                    textareaEl.focus();
                }
            };

            function updateLineNumbers() {
                if (!gutterEl || !textareaEl) return;
                const lines = (textareaEl.value.match(/\n/g) || []).length + 1;
                let numbersHtml = "";
                for (let i = 1; i <= lines; i++) {
                    numbersHtml += i + "<br>";
                }
                gutterEl.innerHTML = numbersHtml;
            }

            function updateCursor() {
                if (!textareaEl) return;
                const text = textareaEl.value.substr(0, textareaEl.selectionStart);
                const lines = text.split("\n");
                const line = lines.length;
                const col = lines[lines.length - 1].length + 1;

                if (window.AndroidEditorBridge) {
                    window.AndroidEditorBridge.onCursorPosition(line, col);
                }
            }

            textareaEl.addEventListener('input', function() {
                currentContent = textareaEl.value;
                isDirty = (currentContent !== originalContent);
                updateLineNumbers();
                updateCursor();

                if (debounceTimer) clearTimeout(debounceTimer);
                debounceTimer = setTimeout(function() {
                    if (window.AndroidEditorBridge && activeFileId) {
                        window.AndroidEditorBridge.onContentChanged(activeFileId, currentContent, isDirty);
                    }
                }, 100);
            });

            textareaEl.addEventListener('keyup', updateCursor);
            textareaEl.addEventListener('click', updateCursor);
            textareaEl.addEventListener('focus', updateCursor);
            textareaEl.addEventListener('scroll', function() {
                gutterEl.scrollTop = textareaEl.scrollTop;
            });

            // Tab key handler (insert 2 spaces)
            textareaEl.addEventListener('keydown', function(e) {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = this.selectionStart;
                    const end = this.selectionEnd;
                    this.value = this.value.substring(0, start) + "  " + this.value.substring(end);
                    this.selectionStart = this.selectionEnd = start + 2;
                    textareaEl.dispatchEvent(new Event('input'));
                }
            });

            // Public bridge methods invoked by Kotlin
            window.monacoBridge = {
                openFile: function(fileId, path, content, language, readOnly) {
                    activeFileId = fileId;
                    activeFilePath = path;
                    currentLanguage = language || "plaintext";
                    originalContent = (content !== null && content !== undefined) ? content : "";
                    currentContent = originalContent;
                    isDirty = false;

                    textareaEl.value = currentContent;
                    textareaEl.readOnly = !!readOnly;
                    updateLineNumbers();
                    updateCursor();

                    // Notify Kotlin of confirmed open
                    if (window.AndroidEditorBridge) {
                        window.AndroidEditorBridge.onContentChanged(activeFileId, currentContent, false);
                    }
                },

                getContent: function() {
                    return textareaEl ? textareaEl.value : currentContent;
                },

                saveFile: function() {
                    if (textareaEl) {
                        currentContent = textareaEl.value;
                    }
                    originalContent = currentContent;
                    isDirty = false;
                    if (window.AndroidEditorBridge && activeFileId) {
                        window.AndroidEditorBridge.onContentChanged(activeFileId, currentContent, false);
                    }
                    return currentContent;
                },

                insertText: function(text) {
                    if (!textareaEl) return;
                    textareaEl.focus();
                    const start = textareaEl.selectionStart;
                    const end = textareaEl.selectionEnd;
                    textareaEl.value = textareaEl.value.substring(0, start) + text + textareaEl.value.substring(end);
                    textareaEl.selectionStart = textareaEl.selectionEnd = start + text.length;
                    textareaEl.dispatchEvent(new Event('input'));
                },

                deleteChar: function() {
                    if (!textareaEl) return;
                    textareaEl.focus();
                    const start = textareaEl.selectionStart;
                    const end = textareaEl.selectionEnd;
                    if (start > 0 && start === end) {
                        textareaEl.value = textareaEl.value.substring(0, start - 1) + textareaEl.value.substring(end);
                        textareaEl.selectionStart = textareaEl.selectionEnd = start - 1;
                        textareaEl.dispatchEvent(new Event('input'));
                    }
                },

                setFont: function(family, size, lineHeight) {
                    if (!textareaEl) return;
                    if (family) textareaEl.style.fontFamily = family + ', monospace';
                    if (size) textareaEl.style.fontSize = size + 'px';
                    if (lineHeight) textareaEl.style.lineHeight = lineHeight + 'px';
                },

                toggleMinimap: function(enabled) {
                    const minimap = document.getElementById('minimap');
                    if (minimap) minimap.style.display = enabled ? 'block' : 'none';
                },

                goToLine: function(lineNumber) {
                    if (!textareaEl) return;
                    const lines = textareaEl.value.split('\n');
                    let charIndex = 0;
                    for (let i = 0; i < Math.min(lineNumber - 1, lines.length); i++) {
                        charIndex += lines[i].length + 1;
                    }
                    textareaEl.focus();
                    textareaEl.setSelectionRange(charIndex, charIndex);
                    updateCursor();
                },

                undo: function() {
                    document.execCommand('undo');
                },

                redo: function() {
                    document.execCommand('redo');
                }
            };

            // Notify native Android bridge that DOM and bridge methods are ready
            document.addEventListener('DOMContentLoaded', function() {
                updateLineNumbers();
                if (window.AndroidEditorBridge) {
                    window.AndroidEditorBridge.onEditorReady();
                }
            });
        })();
    </script>
</body>
</html>
