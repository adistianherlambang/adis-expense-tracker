<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Integrated Terminal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1e1e;
            color: #cccccc;
            font-family: Consolas, Menlo, Monaco, "Courier New", monospace;
            font-size: 13px;
            line-height: 18px;
        }
        #terminal-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 8px 12px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background-color: #1e1e1e;
            cursor: text;
        }
        #terminal-output {
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
            -webkit-user-select: text;
            flex-shrink: 0;
        }
        .terminal-input-row {
            display: flex;
            align-items: center;
            width: 100%;
            margin-top: 4px;
            flex-shrink: 0;
        }
        .terminal-prompt {
            color: #4ec9b0;
            font-weight: bold;
            margin-right: 6px;
            user-select: none;
            -webkit-user-select: none;
        }
        .term-input {
            flex-grow: 1;
            background: transparent;
            color: #ffffff;
            font-family: Consolas, Menlo, Monaco, monospace;
            font-size: 13px;
            border: none;
            outline: none;
            caret-color: #569cd6;
            padding: 2px 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="terminal-container" onclick="focusInput()">
        <div id="terminal-output"></div>
        <div class="terminal-input-row">
            <span class="terminal-prompt">$</span>
            <input type="text" id="term-input" class="term-input" autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Enter shell command...">
        </div>
    </div>

    <script>
        (function() {
            let activeSessionId = "term-1";
            const outputEl = document.getElementById('terminal-output');
            const containerEl = document.getElementById('terminal-container');
            const inputEl = document.getElementById('term-input');

            const history = [];
            let historyIndex = -1;

            window.focusInput = function() {
                if (inputEl) {
                    inputEl.focus();
                }
            };

            const ansiColors = {
                '30': '#000000', '31': '#cd3131', '32': '#0dbc79', '33': '#e5e510',
                '34': '#2472c8', '35': '#bc3fbc', '36': '#11a8cd', '37': '#e5e5e5',
                '90': '#666666', '91': '#f14c4c', '92': '#23d18b', '93': '#f5f543',
                '94': '#3b8eea', '95': '#d670d6', '96': '#29b8db', '97': '#ffffff'
            };

            function parseAnsi(text) {
                let html = "";
                let inTag = false;
                const regex = /\x1b\[([0-9;]*)m/g;
                let lastIndex = 0;
                let match;

                while ((match = regex.exec(text)) !== null) {
                    const plain = text.substring(lastIndex, match.index);
                    html += escapeHtml(plain);
                    lastIndex = regex.lastIndex;

                    const code = match[1];
                    if (code === '0' || code === '') {
                        if (inTag) { html += '</span>'; inTag = false; }
                    } else if (ansiColors[code]) {
                        if (inTag) { html += '</span>'; }
                        html += `<span style="color: ${ansiColors[code]}">`;
                        inTag = true;
                    } else if (code === '1') {
                        html += '<span style="font-weight: bold;">';
                        inTag = true;
                    }
                }
                html += escapeHtml(text.substring(lastIndex));
                if (inTag) html += '</span>';
                return html;
            }

            function escapeHtml(str) {
                return str
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
            }

            inputEl.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const command = inputEl.value;
                    if (command.trim().length > 0) {
                        history.push(command);
                        historyIndex = history.length;
                    }

                    // Print local command echo
                    outputEl.innerHTML += `<div style="color: #4ec9b0; margin: 2px 0;">$ <span style="color: #ffffff;">${escapeHtml(command)}</span></div>`;
                    containerEl.scrollTop = containerEl.scrollHeight;

                    if (window.AndroidTerminalBridge) {
                        window.AndroidTerminalBridge.onTerminalInput(activeSessionId, command + "\n");
                    }
                    inputEl.value = '';
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (history.length > 0 && historyIndex > 0) {
                        historyIndex--;
                        inputEl.value = history[historyIndex];
                    }
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (historyIndex < history.length - 1) {
                        historyIndex++;
                        inputEl.value = history[historyIndex];
                    } else {
                        historyIndex = history.length;
                        inputEl.value = '';
                    }
                } else if (e.ctrlKey && e.key.toLowerCase() === 'c') {
                    e.preventDefault();
                    if (window.AndroidTerminalBridge) {
                        window.AndroidTerminalBridge.onTerminalInput(activeSessionId, "\x03");
                    }
                    inputEl.value = '';
                } else if (e.ctrlKey && e.key.toLowerCase() === 'l') {
                    e.preventDefault();
                    outputEl.innerHTML = '';
                }
            });

            // Public bridge methods invoked by Kotlin
            window.terminalBridge = {
                setSession: function(sessionId, historyText) {
                    activeSessionId = sessionId;
                    if (historyText) {
                        outputEl.innerHTML = parseAnsi(historyText);
                        containerEl.scrollTop = containerEl.scrollHeight;
                    }
                },

                write: function(sessionId, text) {
                    if (sessionId !== activeSessionId) return;
                    outputEl.innerHTML += parseAnsi(text);
                    containerEl.scrollTop = containerEl.scrollHeight;
                },

                clear: function(sessionId) {
                    outputEl.innerHTML = "";
                },

                sendRaw: function(text) {
                    if (text === '\n' || text === '\r') {
                        const event = new KeyboardEvent('keydown', { key: 'Enter' });
                        inputEl.dispatchEvent(event);
                    } else {
                        inputEl.value += text;
                        inputEl.focus();
                    }
                }
            };

            document.addEventListener('DOMContentLoaded', function() {
                focusInput();
                if (window.AndroidTerminalBridge) {
                    window.AndroidTerminalBridge.onTerminalReady();
                }
            });
        })();
    </script>
</body>
</html>
